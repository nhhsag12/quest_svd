[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quest-svd"
version = "0.1.0"
description = "Reproducible MMDocIR retrieval experiments for QUEST-SVD and baseline methods"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "pyarrow",
  "torch",
  "transformers",
  "peft",
  "tqdm",
  "colpali-engine",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["methodology*", "model*", "datasets*", "metrics*"]
